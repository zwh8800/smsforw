name: Build APK

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 platform-tools

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Configure SDK path
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          ls "$ANDROID_HOME/platforms/" 2>/dev/null || echo "no platforms dir"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Find APK
        run: find . -name "*.apk" -o -name "*.aab" 2>/dev/null || echo "No APK/AAB found"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smsforw-debug
          path: "**/*.apk"
          retention-days: 30

      - name: Upload build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build.log
            app/build/reports/
          retention-days: 7
